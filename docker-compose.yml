services:
  oma-server:
    build:
      context: .
      dockerfile: apps/main-node/Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - path: ./.env
        required: false
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/oma.db
      AUTH_DATABASE_PATH: /app/data/auth.db
      SANDBOX_PROVIDER: subprocess
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PLATFORM_ROOT_SECRET: ${PLATFORM_ROOT_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
