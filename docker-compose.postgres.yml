services:
  oma-server:
    build:
      context: .
      dockerfile: apps/main-node/Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgres://oma:oma@postgres:5432/oma
      DATA_DIR: /app/data
      SANDBOX_PROVIDER: subprocess
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PLATFORM_ROOT_SECRET: ${PLATFORM_ROOT_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oma
      POSTGRES_PASSWORD: oma
      POSTGRES_DB: oma
    volumes:
      - oma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oma-pgdata:
